name: OTE Signal Scan

# Runs on GitHub's servers every 5 minutes, so it keeps working even when your
# own machine / sandbox is off. GitHub cron is best-effort and can be delayed
# a few minutes under load.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Avoid overlapping runs piling up (a 50-symbol scan can take a few minutes).
concurrency:
  group: ote-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Persist dedupe state between runs so the same setup isn't re-sent.
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: scanner_state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run signal scan
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          python signal_scanner.py \
            --symbols "EURUSD=X,GBPUSD=X,USDJPY=X,USDCHF=X,AUDUSD=X,NZDUSD=X,USDCAD=X,EURGBP=X,EURJPY=X,GBPJPY=X,EURAUD=X,EURCAD=X,EURCHF=X,GBPAUD=X,GBPCAD=X,GBPCHF=X,AUDJPY=X,CADJPY=X,CHFJPY=X,NZDJPY=X,AUDCAD=X,AUDCHF=X,AUDNZD=X,NZDCAD=X,NZDCHF=X,CADCHF=X,BTC-USD,GC=F,^VIX,^VXN,^VXD,^VVIX,^VIX3M,^VXAPL,^OVX,^VXEEM,^MOVE,^GSPC,^NDX,^DJI,^RUT,^GDAXI,^FTSE,^N225,^HSI,^AXJO,^FCHI,^STOXX50E,^IBEX,^KS11" \
            --timeframes 5m,15m,1h \
            --telegram-token "$TG_TOKEN" \
            --telegram-chat "$TG_CHAT"

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scanner_state.json
          key: scanner-state-${{ github.run_id }}
