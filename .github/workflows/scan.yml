name: OTE Signal Scan

# Self-chaining long run. GitHub's cron does not fire reliably for this repo, so
# instead of depending on it, each run scans every 5 minutes for ~5.5 hours and
# then queues its own successor. The successor waits in the concurrency group
# and starts automatically when this run ends -> continuous coverage from a
# single trigger. The watchdog + a 6-hourly cron are backstops.
on:
  schedule:
    - cron: "0 */6 * * *"     # backstop only (fires rarely/never here)
  workflow_dispatch: {}       # manual + watchdog trigger

permissions:
  actions: write              # needed to re-dispatch the next run (self-chaining)
  contents: read

concurrency:
  group: ote-scan
  cancel-in-progress: false   # let the successor wait, then start when this ends

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # just under GitHub's 6-hour job cap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Persist dedupe state between runs so the same setup isn't re-sent.
      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: scanner_state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run signal scan (self-chaining loop)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          GH_DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_ADMIN: ${{ secrets.TELEGRAM_ADMIN }}
          TELEGRAM_AUTOJOIN: "1"
        run: |
          python signal_scanner.py \
            --symbols "EURUSD=X,GBPUSD=X,USDJPY=X,USDCHF=X,AUDUSD=X,NZDUSD=X,USDCAD=X,EURGBP=X,EURJPY=X,GBPJPY=X,EURAUD=X,EURCAD=X,EURCHF=X,GBPAUD=X,GBPCAD=X,GBPCHF=X,AUDJPY=X,CADJPY=X,CHFJPY=X,NZDJPY=X,AUDCAD=X,AUDCHF=X,AUDNZD=X,NZDCAD=X,NZDCHF=X,CADCHF=X,BTC-USD,GC=F,^VIX,^VXN,^VXD,^VVIX,^VIX3M,^VXAPL,^OVX,^VXEEM,^MOVE,^GSPC,^NDX,^DJI,^RUT,^GDAXI,^FTSE,^N225,^HSI,^AXJO,^FCHI,^STOXX50E,^IBEX,^KS11,^SSMI,^AEX,^NSEI,XIN9.FGI,^TWII,^BVSP" \
            --timeframes 5m,15m,1h \
            --telegram-token "$TG_TOKEN" \
            --telegram-chat "$TG_CHAT" \
            --loop --interval 300 --max-runtime 19800

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scanner_state.json
          key: scanner-state-${{ github.run_id }}
